services:
  - type: web
    name: fennec-do-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: fennec-data
      mountPath: /opt/render/project/src
      sizeGB: 1
